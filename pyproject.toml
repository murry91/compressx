[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compressx"
version = "0.1.0"
description = "A Huffman-based file compression tool written in Python"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Minhal Mansoor" }
]

[project.scripts]
compressx = "compressx.main:main"

[tool.setuptools.packages.find]
where = ["src"]